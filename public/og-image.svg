<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Prajjawal Rajput — Full-Stack & Agentic AI Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F4EFE6"/>
      <stop offset="100%" stop-color="#EAE3D7"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#135222"/>
      <stop offset="100%" stop-color="#2E7D32"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.9" cy="0" r="0.9">
      <stop offset="0%" stop-color="rgba(46,125,50,0.35)"/>
      <stop offset="100%" stop-color="rgba(46,125,50,0)"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- decorative dots -->
  <g fill="#135222" opacity="0.06">
    <circle cx="80"  cy="80"  r="3"/>
    <circle cx="140" cy="80"  r="3"/>
    <circle cx="200" cy="80"  r="3"/>
    <circle cx="80"  cy="140" r="3"/>
    <circle cx="140" cy="140" r="3"/>
    <circle cx="80"  cy="200" r="3"/>
  </g>

  <!-- accent star -->
  <text x="80" y="150" fill="#135222" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="28" font-weight="700">✦ prajjwal-rajput.dev</text>

  <!-- name -->
  <text x="80" y="290" fill="#2E2A25" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="88" font-weight="800" letter-spacing="-2">Prajjawal Rajput</text>

  <!-- role -->
  <text x="80" y="370" fill="url(#accent)" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="44" font-weight="700" font-style="italic">Full-Stack &amp; Agentic AI Engineer</text>

  <!-- tagline -->
  <text x="80" y="440" fill="#5C574F" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="26" font-weight="400">Building the agentic layer of the web · MERN · MCP · LangGraph</text>

  <!-- status pill -->
  <rect x="80" y="490" width="500" height="52" rx="26" fill="rgba(19,82,34,0.08)" stroke="rgba(19,82,34,0.2)" stroke-width="1"/>
  <circle cx="112" cy="516" r="6" fill="#135222"/>
  <text x="132" y="524" fill="#2E2A25" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="20" font-weight="500">Currently @ Barco · Open to Full-Time</text>

  <!-- corner mark -->
  <text x="1120" y="590" fill="#8F897E" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16" text-anchor="end">shipping in Noida, IN</text>
</svg>
